<style>
/* ============ Portfolio brand tokens (from the company presentation) ============ */
:root{
  --bg:#0A1522; --rail:#0C1A2A; --card:#102136; --card2:#0D1C2E; --line:#1C3149; --line2:#264463;
  --text:#EAF0F6; --text2:#A6B6C8; --muted:#6F86A0;
  --teal:#2BB3B1; --teal2:#3FCFCB; --teal-soft:rgba(43,179,177,.14);
  --amber:#E8A93B; --amber-soft:rgba(232,169,59,.14);
  --good:#22C55E; --warn:#F59E0B; --crit:#EF4444;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#9085e9;
  --s1:#1E9E9C; --s2:#d95926; --s3:#9085e9;
  --h0:#13263C; --h1:#0F4A55; --h2:#136B70; --h3:#1F8E8C; --h4:#2BB3B1; --h5:#8FE3DF; --hct3:#fff; --hct5:#06201F;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 10px 30px rgba(0,0,0,.25);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --head:Manrope,Inter,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F6F9; --rail:#FFFFFF; --card:#FFFFFF; --card2:#F7F9FB; --line:#E3E9F0; --line2:#D2DBE5;
  --text:#0E1A2B; --text2:#3E5168; --muted:#6B7D93;
  --teal:#178A88; --teal2:#0F7471; --teal-soft:rgba(23,138,136,.10);
  --amber:#B57A1C; --amber-soft:rgba(181,122,28,.10);
  --good:#15803D; --warn:#B45309; --crit:#DC2626;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#4a3aa7;
  --s1:#0E9A95; --s2:#eb6834; --s3:#4a3aa7;
  --h0:#EEF3F7; --h1:#CDEDEC; --h2:#9CDCDA; --h3:#5CC3C0; --h4:#1F9E9B; --h5:#0F6E6C; --hct3:#06201F; --hct5:#fff;
  --shadow:0 1px 2px rgba(14,26,43,.04), 0 6px 18px rgba(14,26,43,.05);
  color-scheme:light;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal2)} :root[data-theme="light"] a{color:var(--teal)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em}

/* ---------- shell: rail + main; the header zone stays put, only the content scrolls ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh}
.rail{height:100vh;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 22px}
.brand b{font-family:var(--head);font-size:15px;letter-spacing:.3px;display:block}
.brand small{color:var(--muted);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{margin:14px 10px 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:10px;color:var(--text2);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--card2);color:var(--text)}
.nav button.on{background:var(--teal-soft);color:var(--text)}
.nav button.on svg{color:var(--teal)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--muted)}
.nav button.on .cnt{color:var(--teal2)}
.rail .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.rail .foot i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px}

.main{min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:14px 28px;background:var(--bg);border-bottom:1px solid var(--line)}
.pinned{flex:none;padding:20px 28px 16px;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.content{isolation:isolate;padding:20px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1500px}
.pinned > *{max-width:1444px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.search input{flex:1;border:0;background:none;outline:none}
.search kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.ibtn{position:relative;height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;color:var(--text2)}
.ibtn:hover{color:var(--text);border-color:var(--line2)}
.ibtn svg{width:18px;height:18px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--crit);color:#fff;font:700 10.5px Inter;display:grid;place-items:center;padding:0 5px}
.ibtn.ai{background:var(--teal);border-color:var(--teal);color:#06201F;font-weight:700}
.ibtn.ai:hover{background:var(--teal2);color:#06201F}
.lang{display:inline-flex;height:40px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.lang button{border:0;background:none;border-radius:9px;padding:0 11px;cursor:pointer;color:var(--text2);font:700 12px Inter;letter-spacing:.5px}
.lang button.on{background:var(--teal);color:#06201F}
.spacer{flex:1}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;font-weight:800}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:760px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--card)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.demo{background:var(--amber);color:#1b1205;font:700 11px Inter;padding:3px 9px;border-radius:6px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;flex-wrap:wrap}
.ph.stick{position:sticky;top:0;z-index:3;background:var(--card);border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px;font-weight:700}
.ph .hint{color:var(--muted);font-size:12px}
.pb{padding:4px 18px 18px}
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.row2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px 12px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden}
.kpi:hover{border-color:var(--line2)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--teal))}
.kpi .l{color:var(--text2);font-size:12px;font-weight:500}
.kpi .v{font:800 24px/1.15 var(--head);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- lists / tables ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select{height:34px;border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:0 10px;color:var(--text2);font-size:12.5px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.seg button{border:0;background:none;border-radius:7px;padding:4px 11px;cursor:pointer;color:var(--text2);font-size:12.5px}
.seg button.on{background:var(--teal);color:#06201F;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.sorted{color:var(--text)} th .ar{margin-left:4px;opacity:.5}
td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
td.nw,td .nw{white-space:nowrap}
tr.r{cursor:pointer} tr.r:hover td{background:var(--card2)}
tr.r:last-child td{border-bottom:0}
.tt{font-weight:600;line-height:1.38;max-width:560px;min-width:240px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:11.5px}
.cl{max-width:240px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{--c:var(--crit);display:inline-grid;place-items:center;width:42px;height:28px;border-radius:8px;font:600 13px var(--mono);color:var(--text);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent)}
.s-g{--c:var(--good)} .s-t{--c:var(--teal)} .s-y{--c:var(--warn)} .s-r{--c:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--text2);font-size:11.5px;white-space:nowrap}
.chip.new{border-color:var(--teal);color:var(--text);background:var(--teal-soft);font-weight:600}
.chip.fid{border-color:var(--m3);color:var(--text);background:color-mix(in srgb,var(--m3) 16%,transparent);font-weight:600}
.chip.aw{border-color:var(--m2);color:var(--text);background:color-mix(in srgb,var(--m2) 14%,transparent);font-weight:600}
.chip.fit{border-color:color-mix(in srgb,var(--good) 70%,transparent);color:var(--text);background:color-mix(in srgb,var(--good) 12%,transparent)}
.chip.warn{border-color:var(--warn);color:var(--text)}
.dl{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:12.5px}
.dl i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dl.u0 i{background:var(--crit)} .dl.u1 i{background:var(--warn)} .dl.u2 i{background:var(--teal)} .dl.u3 i{background:var(--good)}
.st{height:32px;border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:0 8px;font-size:12.5px;color:var(--text2)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font:700 15px var(--head);margin-bottom:6px}
.empty .src{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* ---------- priority list ---------- */
.prio{display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:20px 44px minmax(0,1fr) 128px 84px;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
.pi:hover{background:var(--card2)}
.pi.ph2{cursor:default;padding-top:8px;padding-bottom:8px;background:var(--card2);font:700 10.5px var(--mono);color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.pi.ph2:hover{background:var(--card2)}
.pi .rk{font:700 12px var(--mono);color:var(--muted);text-align:center}
.pi .score{justify-self:start}
.pi .bd{min-width:0}
.pi .t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi .mt{margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pi .mt i{font-style:normal;opacity:.6;margin:0 2px}
.pi .why{display:flex;gap:5px;flex-wrap:wrap;align-content:center} .pi .why .dash{color:var(--muted)}
.pi .z{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.pi .z i{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:900px){ .pi{grid-template-columns:22px 46px minmax(0,1fr)} .pi.ph2{display:none} .pi .why{grid-column:3} .pi .z{grid-column:3} }

/* ---------- news ---------- */
.news{display:flex;flex-direction:column}
.nd{padding:10px 18px 6px;font:700 11px var(--mono);color:var(--muted);letter-spacing:.6px;text-transform:uppercase;border-top:1px solid var(--line);background:var(--card2)}
.ni{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.ni:hover{background:var(--card2)}
.ni .t{font-weight:600;line-height:1.38}
.ni .m{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:11.5px}

/* ---------- deadlines ---------- */
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lane{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card2);min-height:112px;display:flex;flex-direction:column;gap:7px}
.lane h4{margin:0;display:flex;justify-content:space-between;font:600 12px Inter;color:var(--text2)}
.lane h4 b{font:700 15px var(--mono);color:var(--text)}
.lane .bar{height:3px;border-radius:2px;background:var(--lc)}
.lane .it{font-size:12px;line-height:1.35;padding:7px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.lane .it small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.lane .none{margin:auto 0;text-align:center;color:var(--muted);font-size:11.5px}
.lanes.compact{grid-template-columns:1fr}
.lanes.compact .lane{min-height:auto;flex-direction:row;align-items:center;justify-content:space-between}
.lanes.compact .lane .bar,.lanes.compact .lane .it,.lanes.compact .lane .none{display:none}
.lanes.compact .lane h4{flex:1}

/* ---------- charts / coverage ---------- */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--muted);font-size:10.5px}
.grid{stroke:var(--line)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:280px}
.tip b{display:block}
.cov{display:flex;flex-direction:column}
.cv{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 60px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cv:last-child{border-bottom:0}
.cv.h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding-top:0}
.cv .n{text-align:right;font-family:var(--mono)}
.cv .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.cv .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.heat{display:grid;gap:3px;font-size:11.5px}
.heat .hc{height:24px;border-radius:4px;display:grid;place-items:center;font:600 10.5px var(--mono);color:transparent}
.heat .hc.v1,.heat .hc.v2{color:var(--text)} .heat .hc.v3{color:var(--hct3)} .heat .hc.v4,.heat .hc.v5{color:var(--hct5)}
.heat .rl{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;align-self:center}
.heat .c2{color:var(--muted);text-align:center;font-size:10.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--text2);font-size:11.5px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px} .legend i{width:10px;height:10px;border-radius:50%}
.ramp{display:inline-flex;gap:2px} .ramp i{width:14px;height:10px;border-radius:2px}

/* ---------- map ---------- */
#map{position:relative;z-index:0;height:480px;border-radius:0 0 16px 16px;background:#0b2238}
.leaflet-container{background:#0b2238;font:12px Inter,system-ui,sans-serif}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--text);border:1px solid var(--line2)}
.leaflet-control-attribution{background:rgba(10,21,34,.7)!important;color:#c9d6e3!important}
.leaflet-control-attribution a{color:#fff!important}
.leaflet-control-layers{background:var(--card)!important;color:var(--text)!important;border:1px solid var(--line2)!important;border-radius:10px!important}
.mapfb{height:480px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.mk{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}

/* ---------- companies ---------- */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cc{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--card2)}

  if(/pre-?qualif|expression of interest|\beoi\b|vendor (list|registration)|approved vendor|pre-kvalifikasiya/.test(t)) return "vendor";
  if(x.category === "direct_tender") return "rfq";

function priorities(){

function risks(x){
  const o = [], d = daysLeft(x.deadline);
  if(d !== null && d <= 3) o.push([0, tr(`Vaxt riski: son tarixə ${d} gün qalıb`, `Time risk: ${d} days to deadline`)]); else if(d !== null && d <= 7) o.push([1, tr(`Son tarixə ${d} gün: sənəd hazırlığı sıx olacaq`, `${d} days to deadline: document preparation will be tight`)]);
  if(!x.deadline && x.category === "direct_tender") o.push([1, tr("Son tarix məlum deyil: mənbədən dəqiqləşdirin","Deadline unknown: confirm at the source")]);
  if(x.category === "early_signal" && zoneOf(x) === "intel") o.push([1, tr("Tender hələ elan olunmayıb: vendor list-ə vaxtında düşməmək riski","No tender yet: risk of missing the vendor list")]);
  if(x.category === "award") o.push([2, tr("Müqavilə artıq bağlanıb: imkan yalnız subpodrat / təchizat səviyyəsindədir","Contract already awarded: opportunity is at subcontract / supply level only")]);
  if(x.category === "direct_tender" && !x.budget) o.push([2, tr("Büdcə dərc olunmayıb: marja planlaması çətindir","No published budget: margin planning is harder")]);
  if((x.reasons||[]).some(r => r.startsWith("mənfi"))) o.push([1, tr("Mənfi açar sözlər var: uyğunluğu yoxlayın","Negative keywords present: check the fit")]);
  if(!o.length) o.push([2, tr("Əhəmiyyətli risk aşkarlanmadı","No significant risk detected")]);
  return o;
}

  const s = [tx(x, "action")], epc = (x.companies||[]).filter(c => ["epc","fabricator"].includes(c.role)).map(c => c.name);
  if(x.category === "direct_tender"){

  (DATA.sources||[]).filter(s => s.error).forEach(s => n.push([2, tr("Mənbə xətası: ","Source error: ") + (lang === "en" ? s.source_en || s.source : s.source), s.error, "", "e:" + s.id]));
  evUp().forEach(e => { const d = evDays(e.start), st = (estate[e.id]||{}).status;
    if(d <= 0 && e.relevance === "core") n.push([0, tr("Sərgi indi gedir: ","Exhibition on now: ") + e.title, evRange(e), "ev:" + e.id, "eo:" + e.id]);
    else if(d > 0 && d <= 30 && !st) n.push([1, tr(`Sərgi ${d} gün sonra, qərar verin: `, `Exhibition in ${d} days, decide: `) + e.title, evRange(e), "ev:" + e.id, "ed:" + e.id + ":" + (d <= 7 ? 7 : 30)]); });
  return n;
}
function markBellRead(){
  const n = bellItems(), keep = {};
  bellHot = new Set(n.filter(x => !seen[x[4]]).map(x => x[4]));
  n.forEach(x => keep[x[4]] = seen[x[4]] || Date.now());   // drop keys of resolved notifications
  seen = keep; ls.set(LSN, seen); renderBell();
}
function renderBell(){
  const n = bellItems(), unread = n.filter(x => !seen[x[4]]).length;
  n.sort((a,b) => (bellHot.has(b[4]) || !seen[b[4]]) - (bellHot.has(a[4]) || !seen[a[4]]) || b[0] - a[0]);
  const c = {0:"var(--teal)",1:"var(--warn)",2:"var(--crit)"};
  $("#bellCnt").textContent = unread; $("#bellCnt").hidden = !unread;
  $("#bellBtn").setAttribute("aria-label", tr("Bildirişlər","Notifications") + (unread ? ` (${unread} ${tr("oxunmamış","unread")})` : ""));
  $("#bellPop").innerHTML = `<h4>${esc(tr("Bildirişlər","Notifications"))} · ${n.length}${bellHot.size ? ` <span class="nw">${bellHot.size} ${esc(tr("yeni","new"))}</span>` : ""}</h4>`
    + (n.length ? n.slice(0,15).map(([l,t,s,id,k]) => `<div class="n${bellHot.has(k) ? " hot" : ""}" data-id="${esc(id)}"><i style="background:${c[l]}"></i><div>${esc(short(t, 110))}<small>${esc(s||"")}</small></div></div>`).join("")
      + `<div class="pf">${esc(tr("Bildiriş şərt aradan qalxana qədər siyahıda qalır. Rəqəm yalnız oxunmamışları göstərir.","A notification stays listed until its condition clears. The number shows unread ones only."))}</div>`
    : `<div class="empty">${esc(tr("Bildiriş yoxdur","No notifications"))}</div>`);
}
function renderSources(){
  const S = DATA.sources || [], G = GROUPS();
  $("#srcSum").textContent = tr(`${S.filter(s => !s.error).length}/${S.length} işləyir`, `${S.filter(s => !s.error).length}/${S.length} working`);
  $("#sources").innerHTML = Object.entries(G).map(([g,l]) => { const ss = S.filter(s => (GROUP[s.id] || "topics") === g); return ss.length ? `<h5>${esc(l)}</h5>` + ss.map(s => `<div class="srow"><span><i class="d ${s.error?'e':''}"></i>${esc(lang === "en" ? s.source_en || s.source : s.source)}</span><span class="num" title="${esc(s.error||'')}" style="color:var(--text2)">${s.error ? esc(tr("xəta","error")) : s.relevant + " / " + s.fetched}</span></div>`).join("") : ""; }).join("");
}

/* ================= RENDER / EVENTS ================= */
function renderAll(){ renderNav(); renderExec(); renderKpis(); renderPrio(); renderLanes(); renderTrend(); renderCoverage(); renderList(); renderNews(); renderCompanies(); renderEvents(); renderBell(); renderSources(); if(mapObj){ drawMarkers(); mapLegend(); } }
function setLang(l){ lang = l; try{ localStorage.setItem("tenderRadar.lang", l); }catch(e){} applyStatic(); if(DATA.generated_at){ const g = azStamp(DATA.generated_at); $("#gen").textContent = tr("Yeniləndi: ","Updated: ") + g; $("#sideGen").textContent = tr("Canlı · ","Live · ") + g; } setView(view, true); if(drawerId) openDrawer(drawerId); cpCtx(); }
$("#langSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b && b.dataset.l !== lang) setLang(b.dataset.l); });
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setView(b.dataset.v); });
$("#xkpis").addEventListener("click", e => { const k = e.target.closest(".kpi"); if(!k) return; if(k.dataset.k !== "exec") setView(k.dataset.k); });
$("#path").addEventListener("click", e => { const st = e.target.closest(".stage"); if(!st) return; const k = st.dataset.st;
  const its = T.filter(x => zoneOf(x) !== "news" && active(x) && stageOf(x) === k);
  if(its.length === 1){ openDrawer(its[0].id); return; }
  setView(["rfq","vendor"].includes(k) && its.some(x => zoneOf(x) === "opportunity") ? "opportunities" : "intel"); });
$("#kpis").addEventListener("click", e => { const k = e.target.closest(".kpi"); if(!k) return;
  ({opportunities:() => setView("opportunities"), week:() => { setView("opportunities"); sortKey = "deadline"; sortDir = 1; renderList(); }, pipe:() => { setView("opportunities"); sortKey = "budget_value"; sortDir = -1; renderList(); }, intel:() => setView("intel"), news:() => setView("news")})[k.dataset.k](); });
$("#thead").addEventListener("click", e => { const th = e.target.closest("th"); if(!th) return; const k = th.dataset.k; sortDir = k === sortKey ? -sortDir : (["title","buyer","segment","deadline","signal_type"].includes(k) ? 1 : -1); sortKey = k; renderList(); });
$("#tbody").addEventListener("click", e => { const r = e.target.closest("tr.r"); if(r) openDrawer(r.dataset.id); });
$("#listTools").addEventListener("input", e => { const id = e.target.id; if(id === "lSeg") segF = e.target.value; if(id === "lComp") compF = e.target.value; renderList(); });
$("#listTools").addEventListener("click", e => { const b = e.target.closest("#lType button"); if(b){ typeF = b.dataset.ty; renderList(); } });
$("#nGroup").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; newsG = b.dataset.g; $("#nGroup").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderNews(); });
$("#cTabs").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; cTab = b.dataset.t; $("#cTabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll('[data-v="companies"] > [data-t]').forEach(p => p.hidden = p.dataset.t !== cTab); });
$("#dCt").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; dirCt = b.dataset.c; $("#dCt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderCompanies(); });
$("#dRole").addEventListener("input", renderCompanies);
$("#eRel").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; evRel = b.dataset.r; $("#eRel").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderEvents(); });
$("#eWhen").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; evWhen = b.dataset.w; $("#eWhen").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderEvents(); });
$("#evPanel").addEventListener("change", e => { const c = e.target.closest("[data-e]"), f = e.target.dataset.f; if(!c || !f) return; const id = c.dataset.e;
  estate[id] = {...(estate[id]||{}), [f]: e.target.value}; ls.set(LSE, estate); renderNav(); renderBell(); evHero(); });
$("#evPanel").addEventListener("click", e => { const b = e.target.closest("[data-ics]"); if(!b) return; const ev = EV.find(x => x.id === b.dataset.ics); if(ev) icsFile(ev); });
$("#vendor").addEventListener("change", e => { const row = e.target.closest(".vp"), f = e.target.dataset.f; if(!row || !f) return; const id = row.dataset.p; vstate[id] = {...(vstate[id]||{}), [f]: e.target.value}; ls.set(LSV, vstate); });
$("#q").addEventListener("input", () => { if(["executive","overview","settings"].includes(view)) setView("opportunities"); else renderAll(); });
document.addEventListener("click", e => {
  if(e.target.closest("[data-stop]")) return;
  if(e.target.closest("[data-go]")){ setView(e.target.closest("[data-go]").dataset.go); return; }
  const ic = e.target.closest("#evExec [data-ics]"); if(ic){ const ev = EV.find(x => x.id === ic.dataset.ics); if(ev) icsFile(ev); return; }
  const t = e.target.closest(".pi, .ni, .wr, .lane .it, .cc .lnk, .msg .lnk, .proj, .a3, .brief .lnk"); if(t && t.dataset.id){ openDrawer(t.dataset.id); return; }
  const n = e.target.closest(".pop .n"); if(n){ $("#bellPop").hidden = true; if(n.dataset.id.startsWith("ev:")) setView("events"); else if(n.dataset.id) openDrawer(n.dataset.id); return; }
  if(!e.target.closest(".wrap")) $("#bellPop").hidden = true;
});
$("#scrim").onclick = () => { closeDrawer(); closeCopilot(); };
$("#bellBtn").onclick = () => { const open = $("#bellPop").hidden; if(open) markBellRead(); else { bellHot = new Set(); renderBell(); } $("#bellPop").hidden = !open; };
$("#aiBtn").onclick = () => $("#copilot").classList.contains("open") ? closeCopilot() : openCopilot();
$("#cpClose").onclick = () => closeCopilot();
$("#cpChips").addEventListener("click", e => { const b = e.target.closest("button"); if(b) ask(b.textContent); });
$("#cpForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#cpIn").value.trim(); if(v){ ask(v); $("#cpIn").value = ""; } });
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeDrawer(); closeCopilot(); $("#bellPop").hidden = true; } if(e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });
function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("tenderRadar.theme", t); }catch(e){} $("#themeSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.th === t)); }
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
$("#themeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setTheme(b.dataset.th); });
$("#resetBtn").onclick = () => { $("#resetAsk").hidden = false; };
$("#resetNo").onclick = () => { $("#resetAsk").hidden = true; };
$("#resetYes").onclick = () => { state = {}; ls.set(LS, state); $("#resetAsk").hidden = true; renderAll(); };
$("#exportBtn").onclick = () => {
  const cell = v => `"${String(v ?? "").replace(/"/g,'""').replace(/^([=+\-@\t\r])/,"'$1")}"`;   // CSV-injection safe
  const Z = ZONE(), ST = STAT();
  const head = ["zone","score","signal","status","title","buyer","winner","segment","budget","tender_no","deadline","published","source","url","note"];
  const lines = T.map(x => [Z[zoneOf(x)],x.score,sigName(x.signal_type),ST[meta(x.id).status],x.title,x.buyer,x.winner,segName(x.segment),x.budget,x.tender_no,x.deadline,x.published,srcName(x),x.url,meta(x.id).note].map(cell).join(","));
  const blob = new Blob(["\ufeff" + head.join(",") + "\n" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = Object.assign(document.createElement("a"), {href:URL.createObjectURL(blob), download:"tender-radar.csv"}); a.click(); URL.revokeObjectURL(a.href);
};

(function init(){
  if(DATA.demo) $("#demoBadge").hidden = false;
  $("#themeSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.th === (document.documentElement.dataset.theme || "dark")));
  setLang(lang);
  setView("executive");
})();
</script>
